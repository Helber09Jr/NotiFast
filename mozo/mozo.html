<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotiFast — Mozo</title>
    <link rel="stylesheet" href="mozo.css">
</head>
<body>
    <div id="pantalla-espera" class="pantalla-espera">
        <span class="logo-texto">NotiFast</span>
        <div class="estado-espera">
            <div class="pulso-espera"></div>
            <p id="nombre-mozo" class="nombre-mozo">Cargando...</p>
            <p class="texto-espera">Esperando llamadas</p>
        </div>
        <button id="btn-salir" class="btn-salir">Salir</button>
    </div>

    <div id="pantalla-alerta" class="pantalla-alerta oculto" role="alert" aria-live="assertive">
        <div class="icono-alerta">!</div>
        <p class="label-origen">TE LLAMAN DESDE</p>
        <h2 id="origen-alerta" class="origen-alerta">COCINA</h2>
        <button id="btn-confirmar" class="btn-confirmar">Confirmar</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="mozo.js"></script>
</body>
</html>
