<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotiFast — Panel</title>
    <meta name="theme-color" content="#FF6B00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NotiFast">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="css/cocina.css">
</head>
<body>
    <header class="cabecera">
        <div class="marca-header">
            <span class="logo-texto">NotiFast</span>
            <span id="badge-origen" class="rol-badge">Cocina</span>
        </div>
        <button id="btn-salir">Salir</button>
    </header>

    <main class="contenido">
        <p class="titulo-llamar">¿A quién llamar?</p>
        <div id="grilla-usuarios" class="grilla-usuarios">
            <p class="estado-vacio">Cargando...</p>
        </div>
    </main>

    <div id="notif-enviada" class="notif-enviada oculto" role="status">
        <span id="texto-enviada">✓ Alerta enviada</span>
    </div>

    <div id="pantalla-alerta" class="pantalla-alerta oculto" role="alert" aria-live="assertive">
        <div class="icono-alerta">!</div>
        <p class="label-origen">TE LLAMAN DESDE</p>
        <h2 id="origen-alerta" class="origen-alerta">COCINA</h2>
        <p id="nombre-alerta" class="nombre-alerta"></p>
        <button id="btn-confirmar" class="btn-confirmar">Confirmar</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="js/cocina.js"></script>
</body>
</html>
