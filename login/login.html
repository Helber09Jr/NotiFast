<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotiFast — Ingresar</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="contenedor-login">
        <div class="tarjeta-login">
            <div class="marca">
                <h1 class="logo-texto">NotiFast</h1>
                <p class="autor">by Hjunior</p>
            </div>
            <form id="form-login">
                <div class="campo-form">
                    <label for="email-input">Correo</label>
                    <input type="email" id="email-input" placeholder="tu@correo.com" required autocomplete="email">
                </div>
                <div class="campo-form">
                    <label for="pass-input">Contraseña</label>
                    <input type="password" id="pass-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" id="btn-ingresar">Ingresar</button>
                <p id="error-login" class="mensaje-error" role="alert"></p>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="login.js"></script>
</body>
</html>
